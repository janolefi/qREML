      "LazyData": "true",
      "Author": "Jan-Ole Fischer [aut, cre] (ORCID: <https://orcid.org/0009-0004-1556-9053>)",
      "Maintainer": "Jan-Ole Fischer <jan-ole.fischer@mailbox.org>",
      "Repository": "CRAN"
    },
