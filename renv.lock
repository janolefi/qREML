      ],
      "LinkingTo": [
        "Rcpp",
        "RcppArmadillo"
      ],
      "Depends": [
        "R (>= 3.5.0)",
        "RTMB (>= 2.0)"
      ],
      "RoxygenNote": "7.3.3",
      "Suggests": [
        "knitr",
